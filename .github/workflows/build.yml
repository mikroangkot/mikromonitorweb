name: Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker image prune --all --force

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: false

      - name: Install Dependencies & Accept Licenses
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          yes | sdkmanager --licenses || true
          yes | flutter doctor --android-licenses || true

      - name: Build APK
        env:
          APP_ENV: "production"
          APP_NAME: "Mikro Monitor"
          APP_VERSION: "1.${{ github.run_number }}"
          API_URL: ${{ secrets.API_URL }}
          API_CDN: ${{ secrets.API_CDN }}
          HISTORY_BUS: ${{ secrets.HISTORY_BUS }}
          LIST_BUS: ${{ secrets.LIST_BUS }}
          LOKASI_HEADWAY: ${{ secrets.LOKASI_HEADWAY }}
          HISTORY_HEADWAY: ${{ secrets.HISTORY_HEADWAY }}
          MIKRO_API: ${{ secrets.MIKRO_API }}
          AUTHORIZATION: ${{ secrets.AUTHORIZATION }}

        run: |
          sed -i "s|\"#TEMPLATE_APP_ENV#\"|[\"${APP_ENV}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_APP_NAME#\"|[\"${APP_NAME}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_APP_VERSION#\"|[\"${APP_VERSION}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_API_URL#\"|[\"${API_URL}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_API_CDN#\"|[\"${API_CDN}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_HISTORY_BUS#\"|[\"${HISTORY_BUS}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_LIST_BUS#\"|[\"${LIST_BUS}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_LOKASI_HEADWAY#\"|[\"${LOKASI_HEADWAY}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_HISTORY_HEADWAY#\"|[\"${HISTORY_HEADWAY}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_MIKRO_API#\"|[\"${MIKRO_API}\"]|g" app/helpers/utility/config.py
          sed -i "s|\"#TEMPLATE_AUTHORIZATION#\"|[\"${AUTHORIZATION}\"]|g" app/helpers/utility/config.py

          flutter config --no-analytics
          flet build apk \
            --clear-cache \
            --project "Mikro Monitor" \
            --bundle-id "com.rumahdjigo.mikromonitor" \
            --company "RumahDjigo" \
            --copyright "Copyright © 2026 RumahDjigo. All Rights Reserved." \
            --build-version "1.${{ github.run_number }}" \
            --build-number "${{ github.run_number }}" \
            --android-permissions android.permission.ACCESS_FINE_LOCATION=true \
            --android-permissions android.permission.ACCESS_COARSE_LOCATION=true \
            --android-permissions android.permission.ACCESS_BACKGROUND_LOCATION=true \
            --android-permissions android.permission.FOREGROUND_SERVICE_LOCATION=true \
            --android-features android.hardware.location.gps=true \
            --permissions location \
            --compile-app \
            --cleanup-app \
            --compile-packages \
            --cleanup-packages \
            --split-per-abi \
            --exclude ".git" ".github" ".gitignore" "README.md" "requirements.txt" \
            --extra-flutter-args="--obfuscate --split-debug-info=build/app/outputs/symbols" \
            --yes -vv

      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > release.keystore
          cd build/apk
          APKSIGNER_PATH=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          for apk in *.apk; do
            echo "Signing $apk menggunakan $APKSIGNER_PATH..."
            $APKSIGNER_PATH sign \
              --ks ../../release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "${apk%.apk}-signed.apk" \
              "$apk"
          done
          rm -f ../../release.keystore

      - name: Setup Artifact Directory
        run: |
          mkdir -p dist_app
          cp build/apk/*arm64-v8a-signed.apk dist_app/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MikroMonitor-v.1.${{ github.run_number }}
          path: dist_app/*.apk